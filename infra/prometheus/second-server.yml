global:
  scrape_interval: 60s
  external_labels:
    host: akihiko
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: node-exporter
    static_configs:
      - targets: ["host.docker.internal:19100"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
