global:
  scrape_interval: 60s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'vault'
    metrics_path: /v1/sys/metrics
    scheme: https
    params:
      format: [prometheus]
    tls_config:
      ca_file: /etc/prometheus/certs/vault-ca.pem
      server_name: vault.internal.bonnybonnybonaktan.xyz
    static_configs:
      - targets: ['vault.internal.bonnybonnybonaktan.xyz:8200']

  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgresql_exporter:9187']

  - job_name: 'mariadb'
    static_configs:
      - targets: ['mariadb_exporter:9104']
