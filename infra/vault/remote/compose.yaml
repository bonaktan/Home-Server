services:
  vault:
    image: hashicorp/vault:2.0.1
    container_name: vault-unseal
    user: "0:0"
    cap_add: ["IPC_LOCK"]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'if ! su-exec 100:100 test -f /vault/private/vault.hcl || ! su-exec 100:100 test -s /vault/private/vault.hcl || ! su-exec 100:100 test -r /vault/private/vault.hcl; then echo "Missing, empty, or unreadable /etc/vault-unseal/vault.hcl; copy and configure vault.hcl.example on the remote host" >&2; exit 1; fi; chown 100:100 /vault/data; chmod 700 /vault/data; exec su-exec 100:100 vault server -config=/vault/private/vault.hcl'
    ports:
      - "${VAULT_VPN_IP:?Set VAULT_VPN_IP to the remote VPN interface address}:8200:8200"
    volumes:
      - vault-data:/vault/data
      - type: bind
        source: /etc/vault-unseal
        target: /vault/private
        read_only: true
        bind:
          create_host_path: false
      - /var/log/vault-unseal:/vault/audit
    restart: unless-stopped

volumes:
  vault-data:

