server {
    include conf.d/filters/scanblock.conf;

    listen 443 ssl;
    server_name vault.internal.bonnybonnybonaktan.xyz;

    ssl_certificate /etc/letsencrypt/live/internal.bonnybonnybonaktan.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/internal.bonnybonnybonaktan.xyz/privkey.pem;

    allow 192.168.1.0/24;
    deny all;

    resolver 127.0.0.11 valid=10s;
    proxy_ssl_server_name on;
    proxy_ssl_name vault;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/nginx/vault-primary-ca.crt;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        limit_req zone=general_limit burst=20 nodelay;
        set $upstream https://vault:8200;
        proxy_pass $upstream;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        proxy_cache off;
    }
}
