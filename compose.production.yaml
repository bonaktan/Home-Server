services:
  nginx:
    volumes:
      - /etc/letsencrypt/live/${ROOT_DOMAIN}:/etc/letsencrypt/live/bonnybonnybonaktan.xyz:ro
      - /etc/letsencrypt/archive/${ROOT_DOMAIN}:/etc/letsencrypt/archive/bonnybonnybonaktan.xyz:ro
      - /etc/letsencrypt/live/internal.${ROOT_DOMAIN}:/etc/letsencrypt/live/internal.bonnybonnybonaktan.xyz:ro
      - /etc/letsencrypt/archive/internal.${ROOT_DOMAIN}:/etc/letsencrypt/archive/internal.bonnybonnybonaktan.xyz:ro
  vault:
    volumes:
      - /etc/letsencrypt/live/internal.${ROOT_DOMAIN}:/vault/tls-source:ro
      - /etc/letsencrypt/archive:/archive:ro
  prometheus:
    volumes:
      - /etc/letsencrypt/live/internal.${ROOT_DOMAIN}/fullchain.pem:/etc/prometheus/certs/vault-ca.pem:ro
  postgresql_exporter:
    volumes:
      - /etc/letsencrypt/live/internal.${ROOT_DOMAIN}/fullchain.pem:/etc/vault-agent/vault-ca.pem:ro
  mariadb_exporter:
    volumes:
      - /etc/letsencrypt/live/internal.${ROOT_DOMAIN}/fullchain.pem:/etc/vault-agent/vault-ca.pem:ro
  pterodactyl:
    volumes:
      - /etc/letsencrypt/live/internal.${ROOT_DOMAIN}/fullchain.pem:/etc/vault-agent/vault-ca.pem:ro
  pterodactyl-wings:
    volumes:
      - /etc/letsencrypt/live/${ROOT_DOMAIN}:/etc/letsencrypt/live/bonnybonnybonaktan.xyz:ro
      - /etc/letsencrypt/archive/${ROOT_DOMAIN}:/etc/letsencrypt/archive/bonnybonnybonaktan.xyz:ro
