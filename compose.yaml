networks:
  shared_infra_net:
    driver: bridge
  infra_services:
    driver: bridge
  shared_infra_database:
    driver: bridge
  pterodactyl:
    external: true
    name: pterodactyl_nw
  vault:
    driver: bridge
  vault_observability:
    driver: bridge
  vault_proxy:
    driver: bridge
  database_observability:
    driver: bridge
  nginx_observability:
    driver: bridge

  vault_database:
    internal: true
  vault_clients:
    internal: true

volumes:
  registry-data:
    driver: local
  postgresql-data:
    driver: local
  cloudbeaver-data:
    driver: local
  mariadb-data:
    driver: local
  panel-cache-data:
    driver: local
  observ-grafana-data:
    driver: local
  static-website-data:
    driver: local
  vault-data:
    driver: local
  vault-tls:
    driver: local
  vault-audit:
    driver: local

services:
  ##################################################################
  # Secrets Management
  ##################################################################
  vault:
    image: hashicorp/vault:1.21
    container_name: infra-vault
    entrypoint: ["/usr/local/bin/vault-tls-entrypoint.sh"]
    command: server
    cap_add:
      - IPC_LOCK
    volumes:
      - vault-data:/vault/file
      - vault-tls:/vault/tls
      - vault-audit:/vault/audit
      - ./infra/certs:/vault/tls-source:ro
      - ./infra/vault/vault.hcl:/vault/config/vault.hcl:ro
      - ./infra/vault/vault-tls-entrypoint.sh:/usr/local/bin/vault-tls-entrypoint.sh:ro
      - ./infra/vault/private/database-tls/ca.pem:/vault/database-ca.pem:ro
    networks:
      vault: {}
      vault_observability:
        aliases:
          - vault.internal.bonnybonnybonaktan.xyz
      vault_proxy:
        aliases:
          - vault.internal.bonnybonnybonaktan.xyz
      vault_clients:
        aliases:
          - vault.internal.bonnybonnybonaktan.xyz
      vault_database: {}
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=https://127.0.0.1:8200 VAULT_CACERT=/vault/tls/fullchain.pem VAULT_TLS_SERVER_NAME=vault.internal.bonnybonnybonaktan.xyz vault status"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        labels: service=infra-vault
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
        reservations: { cpus: "0.1", memory: 128M }
    restart: always

  ##################################################################
  # Shared Cloudflare/nginx
  ##################################################################
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: infra-cloudflared
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARED_TOKEN}
    networks:
      - shared_infra_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-cloudflared"
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }
        reservations: { cpus: "0.1", memory: 32M }

    restart: always
  nginx:
    image: nginx:alpine
    container_name: infra-nginx
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/certs:/etc/letsencrypt/live/bonnybonnybonaktan.xyz:ro
      - ./infra/certs:/etc/letsencrypt/archive/bonnybonnybonaktan.xyz:ro
      - ./infra/certs:/etc/letsencrypt/live/internal.bonnybonnybonaktan.xyz:ro
      - ./infra/certs:/etc/letsencrypt/archive/internal.bonnybonnybonaktan.xyz:ro
      - static-website-data:/var/www:ro
    networks:
      - shared_infra_net
      - pterodactyl
      - vault_proxy
      - nginx_observability
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-nginx"
    depends_on:
      - cloudflared
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M}
        reservations: {cpus: "0.1", memory: 32M}

    restart: always

  ##################################################################
  # Shared Database
  ##################################################################
  postgresql:
    image: postgres:18-alpine
    container_name: infra-postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - shared_infra_database
      - vault_database
    volumes:
      - postgresql-data:/var/lib/postgresql
      - ./infra/vault/private/database-tls/postgresql:/tls-source:ro
      - ./infra/vault/database/tls-entrypoint.sh:/etc/database-tls-entrypoint.sh:ro
      - ./infra/vault/database/postgresql-hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
        reservations: {cpus: "0.1", memory: 128M}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-postgresql"
    restart: always
    tmpfs:
      - /run/database-tls
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/database-tls/server.pem
      - -c
      - ssl_key_file=/run/database-tls/server-key.pem
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    entrypoint:
      - sh
      - /etc/database-tls-entrypoint.sh

  cloudbeaver:
    image: dbeaver/cloudbeaver:26.2.2
    container_name: infra-cloudbeaver
    volumes:
      - cloudbeaver-data:/opt/cloudbeaver/workspace
      - ./infra/cloudbeaver/data-sources.json:/opt/cloudbeaver/workspace/GlobalConfiguration/.dbeaver/data-sources.json:ro
      - ./infra/vault/private/database-tls/ca.pem:/etc/cloudbeaver/database-ca.pem:ro
    networks:
      - shared_infra_net
      - shared_infra_database
    depends_on:
      postgresql:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-cloudbeaver"
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 768M}
        reservations: {cpus: "0.1", memory: 256M}
    restart: always

  postgresql_migration: &postgresql_migration
    profiles: [migrations]
    image: flyway/flyway:10
    container_name: infra-postgresql_migration
    command: migrate
    volumes:
      - ./infra/migration/postgresql:/flyway/sql:ro
      - ./infra/vault/private/database-tls/ca.pem:/flyway/database-ca.pem:ro
      - ./infra/vault/database/flyway-entrypoint.sh:/flyway/entrypoint.sh:ro
    entrypoint: [sh, /flyway/entrypoint.sh]
    environment: &postgresql_migration_environment
      FLYWAY_URL: jdbc:postgresql://postgresql:5432/${POSTGRES_DB}?sslmode=verify-full&sslrootcert=/flyway/database-ca.pem
      FLYWAY_MIXED: "true"
      FLYWAY_CLEAN_DISABLED: "true"
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - shared_infra_database
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-postgresql_migration"

  postgresql_bootstrap_migration:
    <<: *postgresql_migration
    container_name: infra-postgresql_bootstrap_migration
    profiles: [bootstrap]
    environment:
      <<: *postgresql_migration_environment
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}

  postgresql_exporter:
    image: home-server/postgresql-exporter-vault:local
    container_name: infra-postgresql_exporter
    environment:
      DATA_SOURCE_URI: postgresql:5432/${POSTGRES_DB}?sslmode=verify-full&sslrootcert=/etc/vault-agent/database-ca.pem
    expose:
      - "9187"
    networks:
      - shared_infra_database
      - database_observability
      - vault_clients
    depends_on:
      postgresql:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-postgresql_exporter"
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 192M}
        reservations: {cpus: "0.1", memory: 32M}
    restart: always
    build:
      context: ./infra/vault/agent
      args:
        SERVICE_IMAGE: prometheuscommunity/postgres-exporter:latest
      target: service
    init: true
    volumes:
      - ./infra/vault/agent/postgresql-exporter.hcl:/etc/vault-agent/agent.hcl:ro
      - ./infra/certs/fullchain.pem:/etc/vault-agent/vault-ca.pem:ro
      - ./infra/vault/private/database-tls/ca.pem:/etc/vault-agent/database-ca.pem:ro
      - ./infra/vault/private/approle/postgresql-exporter:/run/vault-auth:ro

  mariadb:
    image: mariadb:11
    container_name: infra-mariadb
    restart: always
    expose:
      - "3306"
    volumes:
      - mariadb-data:/var/lib/mysql:rw
      - ./infra/vault/private/database-tls/mariadb:/tls-source:ro
      - ./infra/vault/database/tls-entrypoint.sh:/etc/database-tls-entrypoint.sh:ro
    environment:
      MYSQL_DATABASE: ${MARIADB_DB}
      MYSQL_USER: ${MARIADB_USER}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    networks:
      - shared_infra_database
      - vault_database
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
        reservations: {cpus: "0.1", memory: 128M}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-mariadb"
    tmpfs:
      - /run/database-tls
    command:
      - mariadbd
      - --ssl-cert=/run/database-tls/server.pem
      - --ssl-key=/run/database-tls/server-key.pem
    entrypoint:
      - sh
      - /etc/database-tls-entrypoint.sh

  mariadb_migration: &mariadb_migration
    profiles: [migrations]
    image: flyway/flyway:10
    container_name: infra-mariadb_migration
    command: migrate
    volumes:
      - ./infra/migration/mariadb:/flyway/sql:ro
      - ./infra/vault/private/database-tls/ca.pem:/flyway/database-ca.pem:ro
      - ./infra/vault/database/flyway-entrypoint.sh:/flyway/entrypoint.sh:ro
    entrypoint: [sh, /flyway/entrypoint.sh]
    environment: &mariadb_migration_environment
      FLYWAY_URL: jdbc:mariadb://mariadb:3306/${MARIADB_DB}?sslMode=verify-full&serverSslCert=/flyway/database-ca.pem
      FLYWAY_MIXED: "true"
      FLYWAY_CLEAN_DISABLED: "true"
    networks:
      - shared_infra_database
    depends_on:
      mariadb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-postgresql_migration"

  mariadb_bootstrap_migration:
    <<: *mariadb_migration
    container_name: infra-mariadb_bootstrap_migration
    profiles: [bootstrap]
    environment:
      <<: *mariadb_migration_environment
      FLYWAY_USER: root
      FLYWAY_PASSWORD: ${MARIADB_ROOT_PASSWORD}

  mariadb_exporter:
    image: home-server/mariadb-exporter-vault:local
    container_name: infra-mariadb_exporter
    command: []
    expose:
      - "9104"
    networks:
      - shared_infra_database
      - database_observability
      - vault_clients
    depends_on:
      mariadb:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-mariadb_exporter"
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 192M}
        reservations: {cpus: "0.1", memory: 32M}
    restart: always
    build:
      context: ./infra/vault/agent
      args:
        SERVICE_IMAGE: prom/mysqld-exporter:latest
      target: service
    init: true
    volumes:
      - ./infra/vault/agent/mariadb-exporter.hcl:/etc/vault-agent/agent.hcl:ro
      - ./infra/vault/agent/mysql.cnf:/etc/vault-agent/mysql.cnf:ro
      - ./infra/certs/fullchain.pem:/etc/vault-agent/vault-ca.pem:ro
      - ./infra/vault/private/database-tls/ca.pem:/etc/vault-agent/database-ca.pem:ro
      - ./infra/vault/private/approle/mariadb-exporter:/run/vault-auth:ro

  ##################################################################
  # Home Networking
  ##################################################################
  pihole:
    container_name: infra-pihole
    image: pihole/pihole:latest
    # ports:
    #   - "53:53/tcp"
    #   - "53:53/udp"
    #   - "67:67/udp"
    #   - "123:123/udp"
    # expose:
    #   - "80"
    environment:
      TZ: 'Asia/Manila'
      FTLCONF_webserver_api_password: 'putanginanyo@As1'
      FTLCONF_webserver_port: '8080'
      FTLCONF_dns_listeningMode: 'ALL'
    volumes:
      - './infra/pihole:/etc/pihole:rw'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    network_mode: 'host'
    cap_add:
      - NET_ADMIN
      - SYS_TIME
      - SYS_NICE
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-pihole"
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
        reservations: {cpus: "0.25", memory: 128M}


  ##################################################################
  # Pterodactyl Hosting Service
  ##################################################################
  panel-cache:
    image: redis:alpine
    container_name: infra-pterodactyl_cache
    command: [ "redis-server", "--appendonly yes" ]
    expose:
      - 6379
    restart: always
    networks:
      - infra_services
    volumes:
      - panel-cache-data:/data:rw
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    deploy:
      resources:
        limits: {cpus: "0.25", memory: 64M}
        reservations: {cpus: "0.1", memory: 32M}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-redis"
  pterodactyl:
    image: home-server/pterodactyl-vault:local
    container_name: infra-pterodactyl
    restart: always
    expose:
      - 80
    networks:
      - infra_services
      - shared_infra_net
      - shared_infra_database
      - vault_clients
    volumes:
      - ./infra/pterodactyl/var/:/app/var:rw
      - ./infra/pterodactyl/etc:/etc/pterodactyl:rw
      - ./infra/pterodactyl/nginx/:/etc/nginx/http.d:rw
      - ./infra/vault/agent/pterodactyl.hcl:/etc/vault-agent/agent.hcl:ro
      - ./infra/vault/agent/panel-start.sh:/etc/vault-agent/panel-start.sh:ro
      - ./infra/certs/fullchain.pem:/etc/vault-agent/vault-ca.pem:ro
      - ./infra/vault/private/database-tls/ca.pem:/etc/vault-agent/database-ca.pem:ro
      - ./infra/vault/private/approle/pterodactyl:/run/vault-auth:ro
    environment:
      APP_URL: "http://hosting.bonnybonnybonaktan.xyz"
      APP_TIMEZONE: "Asia/Manila"
      APP_SERVICE_AUTHOR: "noreply@hosting.bonnybonnybonaktan.xyz"
      MAIL_FROM: "noreply@hosting.bonnybonnybonaktan.xyz"
      MAIL_DRIVER: "log"
      APP_ENV: "production"
      APP_ENVIRONMENT_ONLY: 'true'
      CACHE_DRIVER: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_DRIVER: "redis"
      REDIS_HOST: "panel-cache"
      DB_HOST: "mariadb"
      DB_PORT: "3306"
      HASHIDS_LENGTH: 8
      MYSQL_ATTR_SSL_VERIFY_SERVER_CERT: 'true'
      DB_DATABASE: panel
      MYSQL_ATTR_SSL_CA: /etc/vault-agent/database-ca.pem
    depends_on:
      mariadb:
        condition: service_healthy
      panel-cache:
        condition: service_healthy
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M}
        reservations: {cpus: "0.25", memory: 192M}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-pterodactyl"
    build:
      context: ./infra/vault/agent
      args:
        SERVICE_IMAGE: ghcr.io/pterodactyl/panel:latest
      target: panel
    stop_grace_period: 45s
    init: true

  pterodactyl-wings:
    image: ghcr.io/pterodactyl/wings:latest
    container_name: infra-pterodactyl-wings
    restart: always
    networks:
      - shared_infra_net
      - infra_services
    expose:
      - 8080
      - 2022
    tty: true
    environment:
      TZ: "UTC"
      WINGS_UID: 988
      WINGS_GID: 988
      WINGS_USERNAME: pterodactyl
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/var/lib/docker/containers/:/var/lib/docker/containers/"
      - "./infra/pterodactyl/etc:/etc/pterodactyl/"
      - "/var/lib/pterodactyl/:/var/lib/pterodactyl/"
      - "/var/log/pterodactyl/:/var/log/pterodactyl/"
      - "/tmp/pterodactyl/:/tmp/pterodactyl/"
      - "/etc/ssl/certs:/etc/ssl/certs:ro"
      - "/run/wings:/run/wings"
    depends_on:
      - pterodactyl
    deploy:
      resources:
        limits: {cpus: "1", memory: 512M}
        reservations: {cpus: "0.25", memory: 128M}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-pterodactyl-wings"

  ##################################################################
  # Docker Image Registry
  ##################################################################
  registry:
    image: registry:2
    container_name: infra-registry
    restart: always
    expose:
      - "5000"
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: "Docker Registry"
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_LOG_LEVEL: info
      REGISTRY_LOG_FORMATTER: json
      REGISTRY_HEALTH_STORAGEDRIVER_ENABLED: "true"
      REGISTRY_HEALTH_STORAGEDRIVER_INTERVAL: 10s
      REGISTRY_HEALTH_STORAGEDRIVER_THRESHOLD: 3
    volumes:
      - registry-data:/var/lib/registry
      - ./infra/registry/auth:/auth:ro
      - ./infra/registry/config.yml:/etc/docker/registry/config.yml:ro
    networks:
      - infra_services
      - shared_infra_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-registry"
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M}
        reservations: {cpus: "0.1", memory: 32M}
  registry-ui:
    image: joxit/docker-registry-ui:latest
    container_name: infra-registry_ui
    restart: unless-stopped
    expose:
      - "80"
    environment:
      REGISTRY_TITLE: "bonnybonnybonaktan.xyz Registry"
      REGISTRY_URL: https://registry.bonnybonnybonaktan.xyz
      SINGLE_REGISTRY: "true"
      DELETE_IMAGES: "true"
      NGINX_PROXY_PASS_URL: http://registry:5000
    depends_on:
      - registry
    networks:
      - infra_services
      - shared_infra_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-registry-ui"
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 32M}
        reservations: {cpus: "0.1", memory: 16M}

  ##################################################################
  # Observability Stack
  ##################################################################
  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    container_name: infra-nginx_exporter
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    networks:
      - nginx_observability
      - infra_services
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 64M}
        reservations: {cpus: "0.1", memory: 32M}
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: infra-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=200MB'
      - '--storage.tsdb.wal-compression'
    environment:
      - GOMEMLIMIT=230MiB
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infra/certs/fullchain.pem:/etc/prometheus/certs/vault-ca.pem:ro
    expose:
      - "9090"
    networks:
      - shared_infra_net
      - infra_services
      - vault_observability
      - database_observability
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-prometheus"
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
        reservations: {cpus: "0.25", memory: 128M}
    restart: always

  node_exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: infra-node_exporter
    command:
      - '--path.rootfs=/host'
    network_mode: host
    pid: host
    restart: always
    volumes:
      - /:/host:ro,rslave
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-node_exporter"
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 64M}
        reservations: {cpus: "0.1", memory: 32M}

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: infra-cadvisor
    privileged: true
    command:
      - '--housekeeping_interval=30s'
      - '--docker_only=true'
      - '--store_container_labels=false'
      - '--disable_metrics=disk,tcp,udp,percpu,sched,process,referenced_memory'
    expose:
      - "8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - infra_services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-cadvisor"

    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M}
        reservations: {cpus: "0.1", memory: 64M}
    restart: always

  loki:
    image: grafana/loki:latest
    container_name: infra-loki
    environment:
      - GOGC=30
      - GOMEMLIMIT=580MiB
    expose:
      - "3100"
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - infra_services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-loki"
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
        reservations: {cpus: "0.25", memory: 96M}
    restart: always

  promtail:
    image: grafana/promtail:latest
    container_name: infra-promtail
    environment:
      - GOGC=50
    volumes:
      - ./infra/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - infra_services
    depends_on:
      - loki
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-promtail"
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 160M}
        reservations: {cpus: "0.1", memory: 64M}
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: infra-grafana
    expose:
      - "3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_PROTOCOL=http
      - GF_SERVER_DOMAIN=grafana.bonnybonnybonaktan.xyz
      - GF_SERVER_ROOT_URL=https://grafana.bonnybonnybonaktan.xyz/
      - GF_SECURITY_CSRF_TRUSTED_ORIGINS=grafana.bonnybonnybonaktan.xyz
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GOGC=50
      - GOMEMLIMIT=550MiB
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - observ-grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - infra_services
      - shared_infra_net
    depends_on:
      - prometheus
      - loki
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-grafana"
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 640M}
        reservations: {cpus: "0.25", memory: 320M}
    restart: always
