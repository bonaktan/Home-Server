networks:
  infra_services:
    driver: bridge
  
services:
  ##################################################################
  # Home Networking
  ##################################################################
  pihole:
    container_name: infra-pihole
    image: pihole/pihole:latest
    # ports:
    #   - "53:53/tcp"
    #   - "53:53/udp"
    #   - "67:67/udp"
    #   - "123:123/udp"
    # expose:
    #   - "80"
    environment:
      TZ: 'Asia/Manila'
      FTLCONF_webserver_api_password: 'holenihaebom'
      FTLCONF_dns_listeningMode: 'ALL'
    volumes:
      - './infra/pihole:/etc/pihole:rw'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    network_mode: 'host'
    cap_add:
      - NET_ADMIN
      - SYS_TIME
      - SYS_NICE
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-pihole"
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
        reservations: {cpus: "0.25", memory: 128M}

  ##################################################################
  # Observability Stack
  ##################################################################
  prometheus:
    image: prom/prometheus:latest
    container_name: infra-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=200MB'
      - '--storage.tsdb.wal-compression'
    environment:
      - GOMEMLIMIT=230MiB
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - 19090:9090
    networks:
      - infra_services
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-prometheus"
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
        reservations: {cpus: "0.25", memory: 128M}
    restart: always

  node_exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: infra-node_exporter
    command:
      - '--path.rootfs=/host'
    network_mode: host
    pid: host
    restart: always
    volumes:
      - /:/host:ro,rslave
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-node_exporter"
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 64M}
        reservations: {cpus: "0.1", memory: 32M}

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: infra-cadvisor
    privileged: true
    command:
      - '--housekeeping_interval=30s'
      - '--docker_only=true'
      - '--store_container_labels=false'
      - '--disable_metrics=disk,tcp,udp,percpu,sched,process'
    expose:
      - "8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - infra_services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-cadvisor"

    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M}
        reservations: {cpus: "0.1", memory: 64M}
    restart: always

  loki:
    image: grafana/loki:latest
    container_name: infra-loki
    environment:
      - GOGC=30
      - GOMEMLIMIT=580MiB
    ports:
      - 13100:3100
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - infra_services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-loki"
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
        reservations: {cpus: "0.25", memory: 96M}
    restart: always

  promtail:
    image: grafana/promtail:latest
    container_name: infra-promtail
    environment:
      - GOGC=50
    volumes:
      - ./infra/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - infra_services
    depends_on:
      - loki
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-promtail"
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 160M}
        reservations: {cpus: "0.1", memory: 64M}
    restart: always
