networks:
  shared_infra_net:
    driver: bridge
  infra_services:
    driver: bridge
  shared_infra_database:
    driver: bridge
  pterodactyl:
    external: true
    name: pterodactyl_nw

volumes:
  registry-data:
    driver: local
  postgresql-data:
    driver: local
  mariadb-data:
    driver: local
  panel-cache-data:
    driver: local
  observ-grafana-data:
    driver: local
  static-website-data:
    driver: local

services:
  ##################################################################
  # Shared Cloudflare/nginx
  ##################################################################
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: infra-cloudflared
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARED_TOKEN}
    networks:
      - shared_infra_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-cloudflared"
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }
        reservations: { cpus: "0.1", memory: 32M }

    restart: always
  nginx:
    image: nginx:alpine
    container_name: infra-nginx
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/certs:/etc/letsencrypt/live/bonnybonnybonaktan.xyz:ro
      - ./infra/certs:/etc/letsencrypt/archive/bonnybonnybonaktan.xyz:ro
      - ./infra/certs:/etc/letsencrypt/live/internal.bonnybonnybonaktan.xyz:ro
      - ./infra/certs:/etc/letsencrypt/archive/internal.bonnybonnybonaktan.xyz:ro
      - static-website-data:/var/www:ro
    networks:
      - shared_infra_net
      - pterodactyl
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-nginx"
    depends_on:
      - cloudflared
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M}
        reservations: {cpus: "0.1", memory: 32M}

    restart: always

  ##################################################################
  # Shared Database
  ##################################################################
  postgresql:
    image: postgres:18-alpine
    container_name: infra-postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - shared_infra_database
    volumes:
      - postgresql-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
        reservations: {cpus: "0.1", memory: 128M}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-postgresql"
    restart: always

  postgresql_pgadmin:
    image: dpage/pgadmin4
    container_name: infra-postgresql_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    networks:
      - shared_infra_net
      - shared_infra_database
    depends_on:
      postgresql:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-postgresql_pgadmin"
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M}
        reservations: {cpus: "0.1", memory: 256M}
    restart: always

  postgresql_migration:
    image: flyway/flyway:10
    container_name: infra-postgresql_migration
    command: migrate
    volumes:
      - ./infra/migration/postgresql:/flyway/sql
    environment:
      FLYWAY_URL: jdbc:postgresql://postgresql:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_MIXED: "true"
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - shared_infra_database
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-postgresql_migration"

  mariadb:
    image: mariadb:11
    container_name: infra-mariadb
    restart: always
    expose:
      - "3306"
    volumes:
      - mariadb-data:/var/lib/mysql:rw
    environment:
      MYSQL_DATABASE: ${MARIADB_DB}
      MYSQL_USER: ${MARIADB_USER}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    networks:
      - shared_infra_database
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
        reservations: {cpus: "0.1", memory: 128M}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-mariadb"
  mariadb_migration:
    image: flyway/flyway:10
    container_name: infra-mariadb_migration
    command: migrate
    volumes:
      - ./infra/migration/mariadb:/flyway/sql
    environment:
      FLYWAY_URL: jdbc:mariadb://mariadb:3306/${MARIADB_DB}
      FLYWAY_USER: root
      FLYWAY_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      FLYWAY_MIXED: "true"
    networks:
      - shared_infra_database
    depends_on:
      mariadb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-postgresql_migration"

  ##################################################################
  # Home Networking
  ##################################################################
  pihole:
    container_name: infra-pihole
    image: pihole/pihole:latest
    # ports:
    #   - "53:53/tcp"
    #   - "53:53/udp"
    #   - "67:67/udp"
    #   - "123:123/udp"
    # expose:
    #   - "80"
    environment:
      TZ: 'Asia/Manila'
      FTLCONF_webserver_api_password: 'putanginanyo@As1'
      FTLCONF_dns_listeningMode: 'ALL'
    volumes:
      - './infra/pihole:/etc/pihole:rw'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    network_mode: 'host'
    cap_add:
      - NET_ADMIN
      - SYS_TIME
      - SYS_NICE
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-pihole"
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
        reservations: {cpus: "0.25", memory: 128M}


  ##################################################################
  # Pterodactyl Hosting Service
  ##################################################################
  panel-cache:
    image: redis:alpine
    container_name: infra-pterodactyl_cache
    command: [ "redis-server", "--appendonly yes" ]
    expose:
      - 6379
    restart: always
    networks:
      - infra_services
    volumes:
      - panel-cache-data:/data:rw
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    deploy:
      resources:
        limits: {cpus: "0.25", memory: 64M}
        reservations: {cpus: "0.1", memory: 32M}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-redis"
  pterodactyl:
    image: ghcr.io/pterodactyl/panel:latest
    container_name: infra-pterodactyl
    restart: always
    expose:
      - 80
    networks:
      - infra_services
      - shared_infra_net
      - shared_infra_database
    volumes:
      - ./infra/pterodactyl/var/:/app/var:rw
      - ./infra/pterodactyl/etc:/etc/pterodactyl:rw
      - ./infra/pterodactyl/nginx/:/etc/nginx/http.d:rw
    environment:
      APP_URL: "http://hosting.bonnybonnybonaktan.xyz"
      APP_TIMEZONE: "Asia/Manila"
      APP_SERVICE_AUTHOR: "noreply@hosting.bonnybonnybonaktan.xyz"
      MAIL_FROM: "noreply@hosting.bonnybonnybonaktan.xyz"
      MAIL_DRIVER: "log"
      DB_PASSWORD: "pterodactyl"
      APP_ENV: "production"
      APP_ENVIRONMENT_ONLY: "false"
      CACHE_DRIVER: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_DRIVER: "redis"
      REDIS_HOST: "panel-cache"
      DB_HOST: "mariadb"
      DB_PORT: "3306"
      HASHIDS_LENGTH: 8
    depends_on:
      mariadb:
        condition: service_healthy
      panel-cache:
        condition: service_healthy
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 384M}
        reservations: {cpus: "0.25", memory: 192M}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-pterodactyl"
  pterodactyl-wings:
    image: ghcr.io/pterodactyl/wings:latest
    container_name: infra-pterodactyl-wings
    restart: always
    networks:
      - shared_infra_net
      - infra_services
    expose:
      - 8080
      - 2022
    tty: true
    environment:
      TZ: "UTC"
      WINGS_UID: 988
      WINGS_GID: 988
      WINGS_USERNAME: pterodactyl
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/var/lib/docker/containers/:/var/lib/docker/containers/"
      - "./infra/pterodactyl/etc:/etc/pterodactyl/"
      - "/var/lib/pterodactyl/:/var/lib/pterodactyl/"
      - "/var/log/pterodactyl/:/var/log/pterodactyl/"
      - "/tmp/pterodactyl/:/tmp/pterodactyl/"
      - "/etc/ssl/certs:/etc/ssl/certs:ro"
      - "/run/wings:/run/wings"
    depends_on:
      - pterodactyl
    deploy:
      resources:
        limits: {cpus: "1", memory: 512M}
        reservations: {cpus: "0.25", memory: 128M}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-pterodactyl-wings"

  ##################################################################
  # Docker Image Registry
  ##################################################################
  registry:
    image: registry:2
    container_name: infra-registry
    restart: always
    expose:
      - "5000"
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: "Docker Registry"
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_LOG_LEVEL: info
      REGISTRY_LOG_FORMATTER: json
      REGISTRY_HEALTH_STORAGEDRIVER_ENABLED: "true"
      REGISTRY_HEALTH_STORAGEDRIVER_INTERVAL: 10s
      REGISTRY_HEALTH_STORAGEDRIVER_THRESHOLD: 3
    volumes:
      - registry-data:/var/lib/registry
      - ./infra/registry/auth:/auth:ro
      - ./infra/registry/config.yml:/etc/docker/registry/config.yml:ro
    networks:
      - infra_services
      - shared_infra_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-registry"
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M}
        reservations: {cpus: "0.1", memory: 32M}
  registry-ui:
    image: joxit/docker-registry-ui:latest
    container_name: infra-registry_ui
    restart: unless-stopped
    expose:
      - "80"
    environment:
      REGISTRY_TITLE: "bonnybonnybonaktan.xyz Registry"
      REGISTRY_URL: https://registry.bonnybonnybonaktan.xyz
      SINGLE_REGISTRY: "true"
      DELETE_IMAGES: "true"
      NGINX_PROXY_PASS_URL: http://registry:5000
    depends_on:
      - registry
    networks:
      - infra_services
      - shared_infra_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-registry-ui"
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 32M}
        reservations: {cpus: "0.1", memory: 16M}

  ##################################################################
  # Observability Stack
  ##################################################################
  prometheus:
    image: prom/prometheus:latest
    container_name: infra-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=200MB'
      - '--storage.tsdb.wal-compression'
    environment:
      - GOMEMLIMIT=230MiB
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    expose:
      - "9090"
    networks:
      - shared_infra_net
      - infra_services
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-prometheus"
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
        reservations: {cpus: "0.25", memory: 128M}
    restart: always

  node_exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: infra-node_exporter
    command:
      - '--path.rootfs=/host'
    network_mode: host
    pid: host
    restart: always
    volumes:
      - /:/host:ro,rslave
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-node_exporter"
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 64M}
        reservations: {cpus: "0.1", memory: 32M}

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: infra-cadvisor
    privileged: true
    command:
      - '--housekeeping_interval=30s'
      - '--docker_only=true'
      - '--store_container_labels=false'
      - '--disable_metrics=disk,tcp,udp,percpu,sched,process'
    expose:
      - "8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - infra_services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-cadvisor"

    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M}
        reservations: {cpus: "0.1", memory: 64M}
    restart: always

  loki:
    image: grafana/loki:latest
    container_name: infra-loki
    environment:
      - GOGC=30
      - GOMEMLIMIT=580MiB
    expose:
      - "3100"
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - infra_services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-loki"
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
        reservations: {cpus: "0.25", memory: 96M}
    restart: always

  promtail:
    image: grafana/promtail:latest
    container_name: infra-promtail
    environment:
      - GOGC=50
    volumes:
      - ./infra/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - infra_services
    depends_on:
      - loki
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-promtail"
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 160M}
        reservations: {cpus: "0.1", memory: 64M}
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: infra-grafana
    expose:
      - "3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_PROTOCOL=http
      - GF_SERVER_DOMAIN=grafana.bonnybonnybonaktan.xyz
      - GF_SERVER_ROOT_URL=https://grafana.bonnybonnybonaktan.xyz/
      - GF_SECURITY_CSRF_TRUSTED_ORIGINS=grafana.bonnybonnybonaktan.xyz
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GOGC=50
      - GOMEMLIMIT=550MiB
    volumes:
      - observ-grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - infra_services
      - shared_infra_net
    depends_on:
      - prometheus
      - loki
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=infra-grafana"
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 640M}
        reservations: {cpus: "0.25", memory: 320M}
    restart: always
